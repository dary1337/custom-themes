name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
    - type: input
      id: theme
      attributes:
          label: Affected theme
          description: Which theme misbehaves? Leave empty if it's a general extension issue.
          placeholder: e.g. Chat-GPT Amoled
      validations:
          required: false

    - type: input
      id: site
      attributes:
          label: Site URL
          description: Page where the bug shows up.
          placeholder: https://chatgpt.com/...
      validations:
          required: false

    - type: dropdown
      id: install_source
      attributes:
          label: How did you install the extension?
          options:
              - Chrome Web Store
              - GitHub release (zip)
              - Built from source
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Extension version
          description: Open the extension popup → About → version. Or chrome://extensions.
          placeholder: 1.1.10
      validations:
          required: true

    - type: textarea
      id: what_happened
      attributes:
          label: What happened?
          description: Steps to reproduce + what you expected.
          placeholder: |
              1. Enabled theme X on site Y
              2. Reloaded the page
              3. Expected: ...
              4. Actually: ...
      validations:
          required: true

    - type: textarea
      id: screenshot
      attributes:
          label: Screenshot
          description: Drag & drop here, or paste a URL.
      validations:
          required: false
